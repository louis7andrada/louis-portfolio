{{- /*
  schema.org CollectionPage + ItemList for a listing page.
  Usage: {{ partial "jsonld/collection.html" (dict "page" . "pages" $pages) }}
  Reconstructed from the live site.
*/ -}}
{{- $p := .page -}}
{{- $pages := .pages -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "@id": "{{ $p.Permalink }}#collection",
  "url": "{{ $p.Permalink }}",
  "name": "{{ $p.Title }} — Louis Andrada (Han’drada)",
  "isPartOf": { "@id": "{{ "/" | absURL }}#website" },
  "about": { "@id": "{{ "/" | absURL }}#person" },
  "mainEntity": {
    "@type": "ItemList",
    "numberOfItems": {{ len $pages }},
    "itemListOrder": "https://schema.org/ItemListUnordered",
    "itemListElement": [
      {{- range $i, $e := $pages }}{{ if $i }},{{ end }}
      { "@type": "ListItem", "position": {{ add $i 1 }}, "url": "{{ $e.Permalink }}", "name": "{{ $e.Title }}" }
      {{- end }}
    ]
  }
}
</script>
