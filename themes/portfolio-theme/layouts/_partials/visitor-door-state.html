{{- /* Session state shared across the face subdomains for the staged visitor door. */ -}}
<script>
window.visitorDoor = (function () {
  var domain = {{ site.Params.face_domain | default "" }};
  function read() {
    try {
      var m = null; try { m = document.cookie.match(/(?:^|; )visitor-door=([^;]+)/); } catch (_) {}
      var encoded = window.name.startsWith("visitor-door:") ? window.name.slice(13) : (m ? m[1] : "");
      if (!encoded) return null;
      var s = JSON.parse(decodeURIComponent(encoded));
      if (!Number.isInteger(s.stage) || s.stage < 1 || s.stage > 4) return null;
      if (typeof s.locked !== "boolean") return null;
      if (s.stage !== 4 && !Number.isFinite(s.deadline)) return null;
      return s;
    } catch (_) { return null; }
  }
  function write(s) {
    var h = location.hostname;
    var shared = domain && (h === domain || h.endsWith("." + domain)) ? "; domain=" + domain : "";
    var encoded = encodeURIComponent(JSON.stringify(s));
    try { document.cookie = "visitor-door=" + encoded + "; path=/; SameSite=Lax" + shared; } catch (_) {}
    var stored = false;
    try { stored = document.cookie.split("; ").some(function (item) { return item === "visitor-door=" + encoded; }); } catch (_) {}
    if (!stored) window.name = "visitor-door:" + encoded;
    else if (window.name.startsWith("visitor-door:")) window.name = "";
  }
  function update(s, now) {
    if (s && !s.locked && s.stage < 4 && now >= s.deadline) {
      s.locked = true;
      if (s.stage === 3) s.finalOpenedAt = now;
      write(s);
    }
    return s;
  }
  // How long each stage stays open, in ms (Louis, council #12552, #12555: 33 s, 33 s, then 11 s).
  var OPEN_MS = { 1: 33000, 2: 33000, 3: 11000 };
  function begin(now) { var s = { stage: 1, deadline: now + OPEN_MS[1], locked: false }; write(s); return s; }
  function unlock(s, now) {
    if (!s || !s.locked || (s.stage !== 1 && s.stage !== 2)) return s;
    s = { stage: s.stage + 1, deadline: now + OPEN_MS[s.stage + 1], locked: false };
    write(s); return s;
  }
  function finish(s) {
    if (!s || !s.locked || s.stage !== 3) return s;
    s = { stage: 4, deadline: null, locked: false }; write(s); return s;
  }
  // A visitor who opened the door the usual way, this visit (wall.html's isOpen): no game for them (Louis, council #12445).
  function openedNormally() {
    if (window.name === "door-session=open") return true;
    try { return /(?:^|; )door-session=open(?:;|$)/.test(document.cookie); } catch (_) { return false; }
  }
  return { OPEN_MS: OPEN_MS, openedNormally: openedNormally, read: read, write: write, update: update, begin: begin, unlock: unlock, finish: finish };
})();
</script>
