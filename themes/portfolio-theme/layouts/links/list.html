<style>
  .links-page {
  --tw-prose-links: #ececec !important;
  margin-bottom: 0.75rem;
}
.dark .tw-link,
.dark .tw-link:visited,
.dark .tw-link:active {
  color: #ececec !important;
  text-decoration: none !important;
}

.dark .tw-link:hover {
  color: #ffffff !important;
}
  /*
   * On md+ the section fills the space between nav and footer so the
   * content block can center itself with margin: auto.
   * 120px = estimated nav (~65px) + footer (~55px). Adjust if your layout differs.
   */
  @media (min-width: 641px) {
    .links-page {
      min-height: calc(100vh - 155px);
    }
    .content-block {
      margin-top: auto;
      margin-bottom: auto;
    }
  }

  .name-band {
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.02em;
    color: #161616;
  }
  .dark .name-band { color: #ececec; }

  /* Louis Andrada / Han / Odi: a staircase, each name a step in and a shade lighter */
  .name-stack { display: flex; flex-direction: column; line-height: 1.18; }
  .name-stack .ns { white-space: nowrap; }
  /* the names are links to the three faces, but read as the names they were
     (main.css colours every .links-page link blue with !important) */
  html .links-page .name-stack a.ns, html .links-page .name-stack a.ns:hover { color: inherit !important; text-decoration: none; }
  html .links-page .name-stack a.ns:hover { text-decoration: underline; text-underline-offset: 3px; }
  .name-stack .ns-2 { padding-left: 2.6ch; opacity: 0.78; }
  .name-stack .ns-3 { padding-left: 5.2ch; opacity: 0.58; }
  .name-stack .ink { font-weight: inherit; color: inherit; }

  /* width locked by JS once rendered so the layout never shifts */
  .content-block { width: fit-content; }
  .links-col     { width: fit-content; }

  .tw-link {
    -webkit-appearance: none;
    appearance: none;
    display: inline-block;
    position: relative;
    background: transparent;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    white-space: nowrap;
    font-size: 1.2rem;
    line-height: 1.32;
    letter-spacing: 0.01em;
    color: #161616;
    text-decoration: none !important;
    transition: color 0.15s ease;
  }
  .tw-link::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 3px;
    height: 1px;
    background: currentColor;
    display: none;
  }
  .tw-link:hover {
    background: transparent !important;
    font-weight: 700;
    color: #000;
    text-decoration: none !important;
  }
  .tw-link:hover::after { display: block; }
  .dark .tw-link { color: #ececec; }
  .dark .tw-link:hover { color: #fff; }
  
  @media (max-width: 640px) {
    .tw-link {
      font-size: 1.1rem;
    }
  }

  /* Section headers ("On-going Collections:", "Next Exhibition:") match the
     link font size but never show the hover underline, since they aren't
     links themselves. */
  .tw-header {
  font-size: 0.95rem;
  line-height: 1.32;
  letter-spacing: 0.01em;
  font-weight: 400;
  color: #161616;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: default;
  margin-top: 0.4rem;
}

.dark .tw-header {
  color: #ececec;
}

.links-header {
  margin-top: 0;
  margin-bottom: 0.15rem;
}

@media (max-width: 640px) {
  .tw-header {
    font-size: 0.85rem;
    margin-top: 0.4rem;
  }

  .links-header {
    margin-top: 0;
  }
}

.tw-headermini {
  font-size: 0.7rem;
  line-height: 1.32;
  letter-spacing: 0.01em;
  font-weight: 400;
  color: #161616;
  cursor: default;
  margin-top: 0.2rem;
}

.dark .tw-headermini {
  color: #ececec;
}

.links-headermini {
  margin-top: 0.9rem;
  margin-bottom: 0.15rem;
}

@media (max-width: 640px) {
  .tw-headermini {
    margin-top: 0.4rem;
  }

  .links-headermini {
    margin-top: 0;
  }
}

.tw-headermini2 {
  font-size: 0.7rem;
  line-height: 1.32;
  letter-spacing: 0.01em;
  font-weight: 400;
  color: #161616;
  cursor: default;
  margin-top: 0.8rem;
}

.dark .tw-headermini2 {
  color: #ececec;
}

.links-headermini2 {
  margin-top: 0.9rem;
  margin-bottom: 0.15rem;
}

@media (max-width: 640px) {
  .tw-headermini2 {
    margin-top: 0.8rem;
  }

  .links-headermini2 {
    margin-top: 0;
  }
}

  /* Sub-items under a header line (collection/exhibition names). Sized down
     from the main nav links so the hierarchy reads clearly, and kept on a
     single line so titles like "The Tree, The Snake, The Fruit" don't wrap. */
  .exhibition-link {
    white-space: nowrap;
    max-width: 100%;
    display: inline-block;
    margin-top: 0.3rem;
  }

@media (max-width: 640px) {
  .exhibition-link {
    /* Scales with viewport width so the longest title still fits on one
       line on narrow screens instead of wrapping. */
    font-size: clamp(0.85rem, 5vw, 1.08rem);
    margin-top: 0.4rem;
  }
}

  /* ── INK — per-character stacking ── */
  .ink { font-weight: 900; color: #000; display: inline; }
  .dark .ink { color: #fff; }

  .i0{
    text-shadow: 0 0 0.5px currentColor,
  }
  .i1 {
    text-shadow: 0 0 0.5px currentColor, 0 0 0.5px currentColor;
  }
  .i2 {
    text-shadow:
      0 0 0.5px currentColor,
      0 0 0.5px currentColor,
      1.5px 0.3px 0.6px currentColor;
  }
  .i3 {
    text-shadow:
      0 0 0.5px currentColor,
      0 0 0.5px currentColor,
      1.5px 0.3px 0.6px currentColor,
      3px 0.6px 1.2px currentColor;
  }
  .i4 {
    text-shadow:
      0 0 0.5px currentColor,
      0 0 0.5px currentColor,
      1.5px 0.3px 0.6px currentColor,
      3px 0.6px 1.2px currentColor,
      4.5px 0.9px 1.8px currentColor;
  }

  /* Desktop photo: height driven by viewport so it never causes scroll */
  .links-photo {
    width: clamp(200px, 24vw, 280px);
    height: clamp(280px, 52vh, 430px);
    object-fit: cover;
    object-position: center;
    filter: grayscale(100%) contrast(1.05);
    display: block;
  }

  /* Mobile */
  @media (max-width: 640px) {
    .name-band { font-size: 0.95rem; }
    .content-block {
      flex-direction: column-reverse;
      align-items: center;
      gap: 1.5rem;
      margin-top: 2rem;
      width: 100% !important;
    }
    .links-col { align-items: center; width: 100% !important; }
    .links-col nav { align-items: center; text-align: center; }
    /* Small portrait photo on mobile so it doesn't shove the links down */
    .links-photo {
      width: min(240px, 62vw);
      height: auto;
      aspect-ratio: 2 / 3;
    }
    .links-page {
      margin-bottom: 1.125rem;
    }
  }

  html.dark .links-page .tw-link,
  html.dark .links-page .tw-link:visited,
  html.dark .links-page .tw-link:hover,
  html.dark .links-page .tw-link:active {
    color: #ececec !important;
  }

</style>

<script>
(function () {
  /* Lock column width so the centered layout never shifts */
  requestAnimationFrame(function () {
    var col = document.querySelector('.links-col');
    if (col) col.style.width = col.getBoundingClientRect().width + 'px';
  });
})();
</script>

})();
