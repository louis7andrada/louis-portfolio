<div id="contactSuccessMessage" class="hidden mb-6 text-green-600 font-medium text-center">
  Thank you — your message has been sent successfully. Louis will get back to you soon.
</div>
<div id="contactErrorMessage" class="hidden mb-6 text-red-600 font-medium text-center">
  Something went wrong sending your message. Please check your information and try again.
</div>
<form 
  id="contactForm"
  class="grid grid-cols-1 gap-4"
>
  <!-- reCAPTCHA v3 token -->
  <input type="hidden" name="g-recaptcha-response" class="recaptcha-token-field">
  <input 
    type="text" 
    name="name" 
    placeholder="Full name*" 
    class="inq-field border bg-gray-100 border-gray-300 rounded p-3"
    required
  />
  <input 
    type="email" 
    name="email" 
    placeholder="Email*" 
    class="inq-field border bg-gray-100 border-gray-300 rounded p-3"
    required
  />
  <input 
    type="tel" 
    name="phone" 
    placeholder="Phone number*" 
    class="inq-field border bg-gray-100 border-gray-300 rounded p-3"
    required
  />
  <textarea 
    name="message" 
    placeholder="Your message...*"
    rows="5"
    class="inq-field border bg-gray-100 border-gray-300 rounded p-3"
    required
  ></textarea>
  <button 
    type="submit"
    class="px-6 py-3 bg-[#575757] text-white rounded-lg font-medium hover:bg-[#9a9a9a] transition"
  >
    Send Message
  </button>
</form>
<script>
const form = document.getElementById("contactForm");
const successMessage = document.getElementById("contactSuccessMessage");
const errorMessage = document.getElementById("contactErrorMessage");
const submitBtn = form.querySelector('button[type="submit"]');
const mobileBtn = document.querySelector('.inq-mobile-submit[data-target="contactForm"]');
const triggerButtons = [submitBtn, mobileBtn].filter(Boolean);
const originalLabels = triggerButtons.map(function(b){ return b.textContent; });

function setBusy() {
  triggerButtons.forEach(function(b){ b.disabled = true; b.style.opacity = "0.5"; b.textContent = "Sending…"; });
}
function setIdle() {
  triggerButtons.forEach(function(b, i){ b.disabled = false; b.style.opacity = ""; b.textContent = originalLabels[i]; });
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  successMessage.classList.add("hidden");
  errorMessage.classList.add("hidden");
  setBusy();

  // Reuses the exact same per-character "convergence" animation as the
  // Purchase/Commission forms (see inquiry_final's shared script). If for
  // any reason that shared API isn't available (e.g. the main inquiry
  // script hasn't loaded), everything below still works — it just runs
  // without the animation, exactly as before.
  var convergenceApi = window.__inqSubmitConvergence;
  var panelEl = form.closest(".inq-panel");
  var convergenceTarget = (mobileBtn && mobileBtn.offsetParent !== null) ? mobileBtn : (submitBtn && submitBtn.offsetParent !== null ? submitBtn : mobileBtn || submitBtn);
  var convergence = (convergenceApi && panelEl && convergenceTarget)
    ? convergenceApi.run(panelEl, convergenceTarget)
    : { finished: Promise.resolve(), restore: function () {}, reverseAndRestore: function () { return Promise.resolve(); } };

  async function failAndRestore(message) {
    await convergence.reverseAndRestore();
    setIdle();
    errorMessage.textContent = message;
    errorMessage.classList.remove("hidden");
  }

  if (typeof grecaptcha === "undefined") {
    await failAndRestore("reCAPTCHA not loaded. Please refresh and try again.");
    return;
  }

  try {
    const token = await grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: "submit" });
    const verifyRes = await fetch("/.netlify/functions/verifyRecaptcha", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token })
    });
    const verifyData = await verifyRes.json();
    if (!verifyData.success || verifyData.score < 0.5) {
      await failAndRestore("Your submission was flagged by our security check. Please try again.");
      return;
    }
    form.querySelector(".recaptcha-token-field").value = token;

    const payload = {
      action: "contact",
      email: form.querySelector('[name="email"]').value.trim(),
      fullName: form.querySelector('[name="name"]').value.trim(),
      phone: form.querySelector('[name="phone"]').value.trim(),
      message: form.querySelector('[name="message"]').value.trim()
    };

    const fetchPromise = fetch(window.APP_CONFIG.googleScriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.text().then(function (t) { return { ok: r.ok, text: t }; });
    });

    // Same rule as the other forms: only confirm success once BOTH the
    // network response and the full animation have finished.
    const combined = await Promise.all([fetchPromise, convergence.finished]);
    const fetchResult = combined[0];
    const result = String(fetchResult.text).trim();

    if (fetchResult.ok && result === "OK") {
      if (convergenceApi) convergenceApi.showSuccess(triggerButtons);
      else triggerButtons.forEach(function(b){ b.textContent = "Sent"; });

      setTimeout(function () {
        convergence.restore();
        form.reset();
        successMessage.classList.remove("hidden");
        if (convergenceApi) convergenceApi.clearSuccess(triggerButtons, originalLabels);
        setIdle();
      }, 1800);
    } else {
      await failAndRestore("There was an error. Please try again later.");
    }
  } catch (err) {
    await failAndRestore("There was an error. Please try again later.");
  }
});
</script>
