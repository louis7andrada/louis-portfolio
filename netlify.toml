# Reconstructed Sep 30 2026 from the live deploy's resolved config.
# (The sitemap and Lighthouse plugins are enabled in the Netlify dashboard.)

[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.157.0"
  HUGO_ENV = "production"
  HUGO_EXTENDED = "true"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google.com https://www.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com https://www.google.com https://www.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.google.com https://www.gstatic.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://cloudflareinsights.com https://ingesteer.services-prod.nsvcs.net; frame-src https://www.google.com https://www.recaptcha.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

[[redirects]]
  from = "/books"
  to = "/oeuvre/"
  status = 301

[[redirects]]
  from = "/books/*"
  to = "/oeuvre/:splat"
  status = 301

[[redirects]]
  from = "https://louisandrada.com/*"
  to = "https://handrada.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.louisandrada.com/*"
  to = "https://handrada.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.handrada.com/*"
  to = "https://handrada.com/:splat"
  status = 301
  force = true
