<header id="siteHeader" class="w-full border-b border-gray-300 px-4 md:px-8 py-4 flex items-center justify-between">

  <!--  All Rights Reserved - Louis Andrada - 2026 -->
  <!--   Webdesign by Jinah Park & Louis Andrada   -->
  <!--     AndradaMono Font by Louis Andrada       -->
  <!--       Codes by Louis Andrada                -->

  <!-- Left: Logo — always visible -->
  <a href="/" id="headerLogo" class="flex items-center">
    <div id="logoMorphWrap" class="logo-morph-wrap" data-active="old">
      <img src="/logoold.png" alt="Louis Andrada Logo" id="logoOld" class="logo-img logo-old active" data-logo="old">
      <img src="/lalogo.png" alt="Louis Andrada Logo" id="logoNew" class="logo-img logo-new" data-logo="new">
      <img src="/halogo.png" alt="Han'drada Logo" id="logoHa" class="logo-img logo-ha" data-logo="ha">
    </div>
  </a>

  <!-- Runs synchronously as the parser reaches it — not deferred to
       DOMContentLoaded — so a continuing-session logo state is restored
       before the browser ever paints the (default-hidden) wrap. Only
       the main script below handles the true first-run entrance. -->
  <script>
  (function () {
    try {
      var wrap = document.getElementById("logoMorphWrap");
      if (!wrap) return;
      function sGet(k) {
        try {
          var v = sessionStorage.getItem(k);
          if (v !== null) return v;
        } catch (e) {}
        try {
          var m = document.cookie.match(new RegExp("(?:^|; )" + k + "=([^;]*)"));
          return m ? decodeURIComponent(m[1]) : null;
        } catch (e) {}
        return null;
      }
      var persisted = sGet("headerLogoState"); // 'old' | 'new' | 'ha'
      if (persisted) {
        wrap.classList.add("logo-no-anim", "logo-ready");
        if (persisted !== "old") {
          wrap.setAttribute("data-active", persisted);
          var imgs = wrap.querySelectorAll(".logo-img");
          for (var i = 0; i < imgs.length; i++) imgs[i].classList.remove("active");
          var target = wrap.querySelector('[data-logo="' + persisted + '"]');
          if (target) target.classList.add("active");
        }
      }
      // No persisted state yet (first run this session) — leave the
      // wrap hidden; the main script reveals it with the entrance
      // animation once the intro door has closed.
    } catch (e) {}
  })();
  </script>

  <!-- Right: Controls -->
  <div class="flex items-center gap-6">

    <!-- Desktop Navigation — non-home pages -->
    {{ if not .IsHome }}
    <nav id="desktopNav" class="hidden md:flex gap-8 text-[12px] lg:text-[14px]">
      <a href="/#artworks-section" data-scroll="artworks" id="navArtworksLinkDesktop" class="dark:text-gray-300 dark:hover:text-white">Artworks</a>
      <a href="/oeuvre/" id="navOeuvreLinkDesktop" class="dark:text-gray-300 dark:hover:text-white">Oeuvre</a>
      <a href="/about" class="dark:text-gray-300 dark:hover:text-white">About</a>
      <a href="/inquiry/" class="dark:text-gray-300 dark:hover:text-white">Inquiry</a>
      <a href="/archive" class="dark:text-gray-300 dark:hover:text-white">Archive</a>
      <a href="/links" class="dark:text-gray-300 dark:hover:text-white">Links</a>
    </nav>
    {{ end }}

    <!-- HOME desktop nav — hidden while home section is visible -->
    {{ if .IsHome }}
    <nav id="homeDesktopNav" class="hidden md:flex gap-8 text-[12px] lg:text-[14px]" style="opacity:0;pointer-events:none;transition:opacity 0.4s ease;">
      <a href="/#artworks-section" data-scroll="artworks" id="navArtworksLinkHome" class="dark:text-gray-300 dark:hover:text-white nav-link-active">Artworks</a>
      <a href="/oeuvre/" id="navOeuvreLinkHome" class="dark:text-gray-300 dark:hover:text-white">Oeuvre</a>
      <a href="/about" class="dark:text-gray-300 dark:hover:text-white">About</a>
      <a href="/inquiry/" class="dark:text-gray-300 dark:hover:text-white">Inquiry</a>
      <a href="/archive" class="dark:text-gray-300 dark:hover:text-white">Archive</a>
      <a href="/links" class="dark:text-gray-300 dark:hover:text-white">Links</a>
    </nav>
    {{ end }}

    <!-- Dark Mode Toggle -->
    <button id="darkModeToggle" type="button" aria-label="Toggle dark mode" class="w-8 h-8 flex items-center justify-center">
      <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 md:w-5 md:h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
      </svg>
      <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 md:w-5 md:h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
      </svg>
    </button>

    <!-- Mobile Menu Toggle -->
    <button id="mobileMenuBtn" type="button" class="menu-toggle" aria-label="Menu" aria-controls="mobileMenu" aria-expanded="false">
      <span class="bar bar-h"></span>
      <span class="bar bar-v"></span>
    </button>

  </div>

</header>

<!-- FULLSCREEN MOBILE MENU — outside header to avoid backdrop-filter stacking context conflict -->
<nav id="mobileMenu" class="fixed inset-0 flex flex-col items-center justify-center gap-10 text-3xl font-medium">
  <a href="/#artworks-section" data-scroll="artworks" id="navArtworksLinkMobile" class="block">Artworks</a>
  <a href="/oeuvre/" id="navOeuvreLinkMobile" class="block">Oeuvre</a>
  <a href="/about" class="block">About</a>
  <a href="/inquiry/" class="block">Inquiry</a>
  <a href="/archive" class="block">Archive</a>
  <a href="/links" class="block">Links</a>
</nav>

<!-- ══════════════════════════════════════════════════════
     INTRO DOOR — lives here, not on individual pages, so it
     runs on whichever page happens to be the first one loaded
     in the session (home or otherwise). See the script block
     below for the once-only / no-cookies fallback behavior.
     ══════════════════════════════════════════════════════ -->
<div id="intro-door">
  <div id="introLogoWrap" class="intro-logo-wrap">
    <img src="/lalogo.png" id="introLogoNew" class="intro-logo-img intro-logo-new active" data-logo="new" alt="Louis Andrada"
         onerror="this.style.display='none'; var f=document.getElementById('introLogoFallback'); if(f) f.style.display='block';" />
    <img src="/logoold.png" id="introLogoOld" class="intro-logo-img intro-logo-old" data-logo="old" alt="Louis Andrada" />
    <img src="/halogo.png" id="introLogoHa" class="intro-logo-img intro-logo-ha" data-logo="ha" alt="Han'drada" />
    <span id="introLogoFallback" class="intro-logo-fallback">Louis Andrada</span>
  </div>
</div>

<style>
  /* ── HEADER ── */
  #siteHeader {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-bottom-color: rgba(255, 255, 255, 0.75);
  }

  html.dark #siteHeader {
    background: var(--glass-bar) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border-bottom-color: var(--glass-bar) !important;
  }

  /* ── LOGO MORPH ── */
  /* Wrap sized to the wider (old) logo so layout doesn't jump.
     Both images stack in the same box; only opacity/scale/filter animate. */
  .logo-morph-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 2.5rem;   /* matches old h-10 */
    width: 7rem;      /* matches old w-28 */
    opacity: 0;       /* hidden by default — JS reveals it, so first paint never flashes it visible */
    transform: scale(0.82);
    filter: blur(7px);
    transition: opacity 0.9s ease, transform 0.9s ease, filter 0.9s ease;
  }

  /* Applied by JS once it's safe to show the logo — either instantly
     (continuing-session restore) or with the transition above playing
     out (first-run entrance). */
  .logo-morph-wrap.logo-ready {
    opacity: 1;
    transform: scale(1);
    filter: blur(0px);
  }

  /* Used briefly by JS to snap-restore a persisted state on page
     load without animating the restore itself. */
  .logo-morph-wrap.logo-no-anim,
  .logo-morph-wrap.logo-no-anim .logo-img {
    transition: none !important;
  }

  @media (max-width: 767px) {
    .logo-morph-wrap {
      height: 2rem;   /* matches old h-8 on mobile if you scale it down */
      width: 5.5rem;
    }
  }

  /* Three logos stack in the same box; JS toggles which one carries
     .active (see data-logo on each <img> and data-active on the wrap) —
     everything else about them (position/size/dark-mode) is shared. */
  .logo-img {
    position: absolute;
    left: 0;
    top: 50%;
    transform-origin: left center;
    transition: opacity 1.1s ease, transform 1.1s ease, filter 1.1s ease;
    will-change: opacity, transform;
    transform: translateY(-50%) scale(0.7);
    opacity: 0;
    filter: blur(4px);
  }

  .logo-img.active {
    transform: translateY(-50%) scale(1);
    opacity: 1;
    filter: blur(0px);
  }

  /* logoold/halogo share the same wide wordmark canvas; lalogo is the
     compact square mark, shown smaller within the same box. */
  .logo-old, .logo-ha {
    height: 2.5rem;
    width: 7rem;
  }

  .logo-new {
    height: 2rem;
    width: 2rem;
  }

  @media (max-width: 767px) {
    .logo-old, .logo-ha { height: 2rem; width: 5.5rem; }
    .logo-new { height: 2rem; width: 2rem; }
  }

  /* ── DARK MODE (header logo) ── */
  /* invert has to live inside the same `filter` declaration as the blur,
     since a second `filter` rule would just overwrite the first instead
     of combining with it. */
  html.dark .logo-img        { filter: invert(1) blur(4px); }
  html.dark .logo-img.active { filter: invert(1) blur(0px); }

  /* ══════════════════════════════════════════
     INTRO DOOR — lalogo morphs into logoold,
     then the door dissolves.
     ══════════════════════════════════════════ */
  #intro-door {
    position: fixed; inset: 0; background: #ffffff; z-index: 999;
    /* --ds is the door's speed multiplier (set by JS when the visitor
       clicks to speed it up); every duration below divides by it. */
    transition: opacity calc(1.3s / var(--ds, 1)) ease;
    display: flex; align-items: center; justify-content: center;
  }
  html.dark #intro-door { background: #0c0c0c; }
  #intro-door.dissolving { opacity: 0; pointer-events: none; }

  .intro-logo-wrap {
    position: relative;
    width: clamp(220px, 30vw, 340px);
    height: clamp(70px, 8vw, 96px);
    cursor: pointer;
  }

  /* Three logos step through in sequence (new → old → ha); JS toggles
     .active on whichever is current — same pattern as the header logo. */
  .intro-logo-img {
    position: absolute;
    top: 50%;
    left: 50%;
    width: auto;
    object-fit: contain;
    transform-origin: center center;
    transition: opacity calc(0.9s / var(--ds, 1)) ease, transform calc(0.9s / var(--ds, 1)) ease, filter calc(0.9s / var(--ds, 1)) ease;
    will-change: opacity, transform, filter;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.94);
    filter: var(--logo-invert, ) blur(3px) var(--fog-off);
  }

  .intro-logo-img.active {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    filter: var(--logo-invert, ) blur(0px) var(--fog-on);
  }

  .intro-logo-new { height: 78%; } /* lalogo — compact mark, centered within the wider wrap */
  .intro-logo-old,
  .intro-logo-ha { height: 100%; } /* wide wordmark canvases — span the full wrap */

  /* Final stage: whichever logo is active morphs away (bigger blur/scale,
     slower) as the door dissolves underneath it, instead of a flat fade */
  #intro-door.dissolving .intro-logo-img.active {
    transition: opacity calc(1.3s / var(--ds, 1)) ease, transform calc(1.3s / var(--ds, 1)) ease, filter calc(1.3s / var(--ds, 1)) ease;
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.18);
    filter: var(--logo-invert, ) blur(7px) var(--fog-off);
  }

  /* dark mode invert lives inside the same filter declaration as the blur,
     so the two combine instead of one overwriting the other */
  /* Ink-bleed fog for the logos (same idea as the page background): the
     mark sits in three stacked shadows — tight and strong at its edge,
     wider and weaker outward, each dropping a little further down for
     gravity — that start out fully transparent so they fade in with the
     logo. Every filter state lists the exact same functions so the browser
     can interpolate between them. */
  #intro-door {
    --logo-invert: ;
    --fog-off: drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 0 rgba(0,0,0,0));
    --fog-on:  drop-shadow(0 1px 3px rgba(0,0,0,.45)) drop-shadow(0 6px 12px rgba(0,0,0,.24)) drop-shadow(0 14px 28px rgba(0,0,0,.12));
  }
  html.dark #intro-door {
    --logo-invert: invert(1);
    --fog-off: drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(255,255,255,0)) drop-shadow(0 0 0 rgba(255,255,255,0));
    --fog-on:  drop-shadow(0 1px 3px rgba(255,255,255,.5)) drop-shadow(0 6px 12px rgba(255,255,255,.26)) drop-shadow(0 14px 28px rgba(255,255,255,.13));
  }

  /* Responsive door sizing — the clamp() minimums above are fine on
     desktop/tablet but too large once vw drops below them on phones */
  @media (max-width: 699px) {
    .intro-logo-wrap {
      width: clamp(180px, 58vw, 260px);
      height: clamp(58px, 18.5vw, 82px);
    }
  }
  @media (max-width: 420px) {
    .intro-logo-wrap {
      width: clamp(150px, 66vw, 210px);
      height: clamp(48px, 21vw, 68px);
    }
  }

  .intro-logo-fallback {
    display: none;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1rem;
    letter-spacing: 0.1em;
  }

  /* ── MOBILE ONLY: hide toggle on desktop via CSS (not Tailwind, which may not scan this partial) ── */
  #mobileMenuBtn {
    display: none;
  }

  @media (max-width: 767px) {
    #mobileMenuBtn {
      display: flex !important;
    }
  }

  /* ── MENU OPEN: raise header, hide logo + darkmode, keep only the toggle ── */
  body[data-menu-open] #siteHeader {
    z-index: 600 !important;
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border-bottom-color: transparent !important;
    box-shadow: none !important;
  }

  body[data-menu-open] #headerLogo,
  body[data-menu-open] #desktopNav,
  body[data-menu-open] #homeDesktopNav {
    opacity: 0 !important;
    pointer-events: none !important;
    transition: opacity 0.2s ease;
  }

  @media (max-width: 767px) {
    #darkModeToggle {
      display: none;
    }
    body[data-menu-open] #darkModeToggle {
      display: flex !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }
  }

  /* ── TOGGLE BUTTON ── */
  .menu-toggle {
    position: relative;
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
    padding: 0;
    width: 2.2rem;
    height: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .menu-toggle:hover { opacity: 0.6; }

  /* ── BAR LINES ── */
  .bar {
    position: absolute;
    background: currentColor;
    border-radius: 1px;
    top: 50%;
    left: 50%;
  }

  .bar-h {
    width: 18px;
    height: 2px;
    transform: translate(-50%, -50%);
  }

  .bar-v {
    width: 2px;
    height: 18px;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    will-change: transform, opacity;
    transition: transform 0.45s ease, opacity 0.35s ease;
  }

  .menu-toggle.open .bar-v {
    transform: translate(-50%, -50%) scaleY(0);
    opacity: 0;
  }

  /* ── MOBILE MENU ── */
  #mobileMenu {
    z-index: 500 !important;
    background: rgba(240, 240, 240, 0.88) !important;
    backdrop-filter: blur(40px) saturate(1.8) !important;
    -webkit-backdrop-filter: blur(40px) saturate(1.8) !important;
    opacity: 0;
    transform: scale(0.96);
    filter: blur(10px);
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease;
  }
  #mobileMenu.open {
    opacity: 1;
    transform: scale(1);
    filter: blur(0px);
    pointer-events: auto;
  }

  html.dark #mobileMenu {
    background: rgba(14, 14, 14, 0.88) !important;
    backdrop-filter: blur(40px) saturate(1.8) !important;
    -webkit-backdrop-filter: blur(40px) saturate(1.8) !important;
  }

  #mobileMenu a {
    transition: opacity 0.3s ease, transform 0.3s ease;
    opacity: 0;
    transform: translateY(8px);
  }

  #mobileMenu.open a {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── HIDE FILTER BARS when mobile menu is open ── */
  body[data-menu-open] .artwork-filter-bar,
  body[data-menu-open] .archive-filter-bar {
    opacity: 0 !important;
    pointer-events: none !important;
  }

  /* ── ACTIVE NAV LINK ── */
  .nav-link-active {
    font-weight: bold;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const siteHeader     = document.getElementById("siteHeader");
  const homeSection    = document.getElementById("home-section");
  const homeDesktopNav = document.getElementById("homeDesktopNav");
  const logoMorphWrap  = document.getElementById("logoMorphWrap");
  const door           = document.getElementById("intro-door");

  /* ══════════════════════════════════════════════════════
     STORAGE HELPER — sessionStorage first, with a session
     cookie as a fallback for private-browsing modes or any
     browser that blocks/clears web storage. If BOTH fail,
     everything below still degrades safely: the door will
     simply show on every page rather than throwing an error.
     ══════════════════════════════════════════════════════ */
  function storageGet(key) {
    try {
      const v = sessionStorage.getItem(key);
      if (v !== null) return v;
    } catch (e) { /* sessionStorage blocked — fall through to cookie */ }
    try {
      const match = document.cookie.match(new RegExp('(?:^|; )' + key + '=([^;]*)'));
      return match ? decodeURIComponent(match[1]) : null;
    } catch (e) { /* cookies blocked too — nothing we can do */ }
    return null;
  }

  function storageSet(key, value) {
    try { sessionStorage.setItem(key, value); } catch (e) {}
    try {
      // Mirrored to a session cookie (no expiry = cleared when the
      // browser closes) so the "only once" behavior still holds even
      // if sessionStorage specifically is the thing that's blocked.
      document.cookie = key + "=" + encodeURIComponent(value) + "; path=/; SameSite=Lax";
    } catch (e) {}
  }

  /* ══════════════════════════════════════════════════════
     FIRST-VISIT CONTENT REVEAL — every image and text element
     on the page (nav links, headings, paragraphs, artwork grid,
     footer, everything) materializes in via a blur+opacity fog,
     but only on a session's very first page load. Checked up
     front here, before the door logic below has a chance to
     mark the flag seen. The header logo is excluded since it
     already has its own dedicated entrance animation, and
     popups/modals/menus are excluded since they stay hidden
     until opened regardless of this class.
     ══════════════════════════════════════════════════════ */
  const firstVisitThisSession = !storageGet("intro-seen");
  let revealItems = [];

  // The page-reveal system (baseof.html, "PAGE FOG-IN") now tags and reveals
  // content on every page load. On a first visit it holds until the door is
  // gone; this is what tells it so.
  function prepareFirstVisitReveal() {}

  function playFirstVisitReveal() {
    try { document.dispatchEvent(new Event("door-done")); } catch (e) {}
  }

  if (firstVisitThisSession) prepareFirstVisitReveal();

  /* ══════════════════════════════════════════════════════
     HEADER LOGO MORPH — continuity across pages, one-time
     entrance, and it waits for the intro door (below) to
     actually finish before it does anything.
     ══════════════════════════════════════════════════════ */
  let logoSequenceStarted = false;

  function startHeaderLogoSequence() {
    if (logoSequenceStarted) return; // guards against the door's error fallback double-firing this
    logoSequenceStarted = true;
    if (!logoMorphWrap) return;

    const STATE_KEY = "headerLogoState"; // 'old' | 'new' | 'ha'
    const CYCLE = ["old", "new", "ha"];
    const persisted  = storageGet(STATE_KEY);
    const isFirstRun = !persisted; // no page in this session has run the cycle yet

    const MATERIALIZE_DURATION       = 900;  // must match .logo-morph-wrap's transition duration
    const HOLD_BEFORE_TOGGLE_FIRST   = 3200; // first-run: time the logo sits still after materializing, before flipping

    function advance() {
      const current = logoMorphWrap.getAttribute("data-active") || "old";
      const next = CYCLE[(CYCLE.indexOf(current) + 1) % CYCLE.length];
      logoMorphWrap.setAttribute("data-active", next);
      logoMorphWrap.querySelectorAll(".logo-img").forEach((img) => img.classList.remove("active"));
      const target = logoMorphWrap.querySelector('[data-logo="' + next + '"]');
      if (target) target.classList.add("active");
      storageSet(STATE_KEY, next);
    }

    if (isFirstRun) {
      // Nothing was restored by the inline pre-script, so the wrap is
      // still in its default hidden state — reveal it now, with the
      // transition playing out as the actual entrance animation.
      requestAnimationFrame(() => {
        logoMorphWrap.classList.add("logo-ready");
      });
      setTimeout(advance, MATERIALIZE_DURATION + HOLD_BEFORE_TOGGLE_FIRST);
    } else {
      // Already instantly restored by the inline pre-script — re-enable
      // transitions, then advance on the very next frame so it reads as
      // starting right when the page opens, not a beat after.
      requestAnimationFrame(() => {
        logoMorphWrap.classList.remove("logo-no-anim");
        requestAnimationFrame(advance);
      });
    }
  }

  /* ══════════════════════════════════════════════════════
     INTRO DOOR — runs at most once per session. The header
     logo sequence above is only started once this resolves,
     whichever of these paths gets there first:
       • no door element on this page
       • door already seen this session (storage says so)
       • the door plays out fully or gets clicked through
       • anything throws unexpectedly (fail safe: hide + mark seen)
     ══════════════════════════════════════════════════════ */
  try {
    if (!door) {
      startHeaderLogoSequence();
      if (firstVisitThisSession) playFirstVisitReveal();
    } else if (storageGet("intro-seen")) {
      door.style.display = "none";
      startHeaderLogoSequence();
    } else {
      // Three logos now step through here (new → old → ha) instead of two,
      // so each individual hold/transition is shorter than before — that
      // keeps the whole sequence landing on the page in about the same
      // total time it always has, rather than growing by half again just
      // because there's an extra logo to show.
      const INTRO_STEPS         = ["new", "old", "ha"];
      const FIRST_HOLD          = 1100; // first logo shows on its own before anything starts morphing
      const MORPH_TRANSITION    = 900;  // matches .intro-logo-img's 0.9s transition, so a logo has fully arrived before the next step
      const HOLD_BETWEEN        = 350;  // middle logo sits visible before morphing again
      const HOLD_AFTER_FINAL    = 700;  // final logo sits visible before the door dissolves
      const DISSOLVE_TRANSITION = 1300; // matches #intro-door's opacity transition & the dissolving-stage logo transition
      // Whole default run, used to judge how early a click came.
      const DEFAULT_TOTAL = FIRST_HOLD + (MORPH_TRANSITION + HOLD_BETWEEN) + (MORPH_TRANSITION + HOLD_AFTER_FINAL) + DISSOLVE_TRANSITION;

      let step      = 0; // index into INTRO_STEPS of whichever logo is currently shown
      let dissolved = false;
      let speed     = 1; // door-wide speed multiplier; every click raises it
      let timer     = null;
      let nextAt    = 0;    // when the pending step fires (ms, performance.now clock)
      let nextFn    = null;
      const t0      = performance.now();

      // Everything is timed in "default-speed" milliseconds and divided by
      // the current speed, so speeding up mid-run just rescales what's left
      // instead of cutting a step off or jumping ahead.
      function later(fn, ms) {
        clearTimeout(timer);
        nextFn = fn;
        nextAt = performance.now() + ms / speed;
        timer = setTimeout(fn, ms / speed);
      }

      function applySpeed(next) {
        const prev = speed;
        speed = next;
        door.style.setProperty("--ds", String(speed));
        // Transitions already in flight were built with the old duration:
        // speed them up by the same ratio so the whole door moves as one.
        try {
          door.getAnimations({ subtree: true }).forEach((a) => { a.playbackRate *= speed / prev; });
        } catch (e) {}
        return prev;
      }

      function showIntroLogo(name) {
        door.querySelectorAll(".intro-logo-img").forEach((el) => {
          el.classList.toggle("active", el.getAttribute("data-logo") === name);
        });
      }

      function dissolve() {
        if (dissolved) return;
        dissolved = true;
        door.classList.add("dissolving");
        // Start the header logo's reveal as soon as the door begins
        // fading, so it appears a bit earlier — overlapping with the
        // door's fade rather than waiting for it to fully disappear.
        startHeaderLogoSequence();
        later(() => {
          door.style.display = "none";
          storageSet("intro-seen", "1");
          // Unlike the header logo above, the page content reveal waits
          // until the door has fully disappeared before starting — firing
          // it earlier (mid-fade) let the whole 0.8s pop-in finish while
          // still masked behind the door, so it was never actually visible.
          playFirstVisitReveal();
        }, DISSOLVE_TRANSITION);
      }

      // new → old → ha → dissolve, each step scheduled only after the
      // previous logo's transition has had time to finish.
      function advance() {
        step++;
        if (step >= INTRO_STEPS.length) { dissolve(); return; }
        showIntroLogo(INTRO_STEPS[step]);
        const isFinal = step === INTRO_STEPS.length - 1;
        later(advance, MORPH_TRANSITION + (isFinal ? HOLD_AFTER_FINAL : HOLD_BETWEEN));
      }

      later(advance, FIRST_HOLD);

      // A click doesn't skip — it speeds the whole door up. The earlier in
      // the default run the click lands, the bigger the boost (x2.5 right at
      // the start, x1.5 near the end), and clicks stack, up to x6.
      door.addEventListener("click", () => {
        if (dissolved) return;
        const now = performance.now();
        const earliness = 1 - Math.min(1, (now - t0) / DEFAULT_TOTAL);
        const remainingDefault = Math.max(0, nextAt - now) * speed;
        applySpeed(Math.min(6, speed * (1.5 + earliness)));
        later(nextFn, remainingDefault);
      });
    }
  } catch (e) {
    // Something unexpected broke the door logic — never leave the
    // visitor stuck behind it, and never leave the header logo waiting.
    try { if (door) door.style.display = "none"; } catch (e2) {}
    try { storageSet("intro-seen", "1"); } catch (e2) {}
    startHeaderLogoSequence();
    if (firstVisitThisSession) playFirstVisitReveal();
  }

  /* ── SCROLL HELPER ── */
  function scrollToSection(el) {
    const headerHeight = siteHeader ? siteHeader.offsetHeight : 0;
    const top = el.getBoundingClientRect().top + window.scrollY - headerHeight;
    window.scrollTo({ top, behavior: "smooth" });
  }

  /* ── ARTWORKS LINK HANDLER ── */
  function artworksNavHandler(e) {
    e.preventDefault();

    const mobileMenu    = document.getElementById("mobileMenu");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    if (mobileMenu && mobileMenu.classList.contains("open")) {
      mobileMenu.classList.remove("open");
      if (mobileMenuBtn) mobileMenuBtn.classList.remove("open");
      document.body.removeAttribute("data-menu-open");
      if (!document.body.getAttribute("data-lightbox-open")) {
        document.body.style.overflow = "";
      }
    }

    const target = document.getElementById("artworks-section");
    if (target) {
      setTimeout(() => {
        scrollToSection(target);
        setTimeout(() => {
          if (homeDesktopNav) {
            homeDesktopNav.style.opacity = "1";
            homeDesktopNav.style.pointerEvents = "auto";
          }
        }, 60);
      }, 60);
    } else {
      sessionStorage.setItem("scrollTarget", "artworks-section");
      window.location.href = "/";
    }
  }

  document.querySelectorAll('[data-scroll="artworks"]').forEach(link => {
    link.addEventListener("click", artworksNavHandler);
  });

  /* ── HOME PAGE: watch home-section leaving viewport ── */
  if (homeSection && homeDesktopNav) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.intersectionRatio > 0.1) {
          homeDesktopNav.style.opacity = "0";
          homeDesktopNav.style.pointerEvents = "none";
        } else {
          homeDesktopNav.style.opacity = "1";
          homeDesktopNav.style.pointerEvents = "auto";
        }
      });
    }, { threshold: [0, 0.1] });

    observer.observe(homeSection);
  }

  /* ── ACTIVE LINK STATE ── */
  const pathname = window.location.pathname;
  const isHome   = pathname === "/" || homeSection !== null;

  if (!homeSection) {
    let activePage = "";
    if (pathname.includes("/inquiry/")) activePage = "inquiry";
    else if (pathname.includes("/about")) activePage = "about";
    else if (pathname.includes("/archive")) activePage = "archive";
    else if (pathname.includes("/links")) activePage = "links";
    else if (pathname.includes("/artworks") || pathname === "/") activePage = "artworks";

    document.querySelectorAll("nav:not(#mobileMenu) a").forEach(link => {
      const href = link.getAttribute("href") || "";
      if (activePage === "artworks" && (href.includes("artworks") || href.includes("#artworks"))) {
        link.classList.add("nav-link-active");
      } else if (activePage && href.includes(`/${activePage}`)) {
        link.classList.add("nav-link-active");
      }
    });
  }

  const mobileMenu = document.getElementById("mobileMenu");
  if (mobileMenu) {
    mobileMenu.querySelectorAll("a").forEach(link => {
      const href = link.getAttribute("href") || "";
      let match = false;
      if (isHome && (href.includes("artworks") || href.includes("#artworks"))) {
        match = true;
      } else if (!isHome) {
        if (pathname.includes("/inquiry/") && href.includes("inquiry/")) match = true;
        else if (pathname.includes("/about") && href.includes("about")) match = true;
        else if (pathname.includes("/archive") && href.includes("archive")) match = true;
        else if (pathname.includes("/links") && href.includes("links")) match = true;
        else if ((pathname.includes("/artworks") || pathname === "/") && (href.includes("artworks") || href.includes("#artworks"))) match = true;
      }
      if (match) link.classList.add("nav-link-active");
    });
  }

  /* ── HASH SCROLL on page load ── */
  const savedTarget = sessionStorage.getItem("scrollTarget");

  if (savedTarget) {
    sessionStorage.removeItem("scrollTarget");

    const target = document.getElementById(savedTarget);
    if (target) {
      setTimeout(() => {
        scrollToSection(target);

        if (homeSection && homeDesktopNav) {
          const rect = homeSection.getBoundingClientRect();
          if (rect.top < 0) {
            homeDesktopNav.style.opacity = "1";
            homeDesktopNav.style.pointerEvents = "auto";
          } else {
            homeDesktopNav.style.opacity = "0";
            homeDesktopNav.style.pointerEvents = "none";
          }
        }
      }, 100);
    }
  }

});
</script>
