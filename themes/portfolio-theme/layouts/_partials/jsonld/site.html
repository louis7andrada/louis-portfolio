{{- /* schema.org Person + WebSite identity graph (home + about). Reconstructed from the live site. */ -}}
{{- $desc := "Paintings and artist books by Louis Andrada, also known as Han’drada — a Brazilian-born, Toronto-based painter of dark existentialist work." -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ "/" | absURL }}#person",
      "name": "Louis Andrada",
      "alternateName": ["Han’drada", "Han'drada", "Handrada"],
      "description": "{{ $desc }}",
      "jobTitle": "Visual Artist",
      "knowsAbout": ["Painting", "Contemporary art", "Existentialism", "Occult symbolism", "Folklore", "Artist books"],
      "nationality": { "@type": "Country", "name": "Brazil" },
      "homeLocation": { "@type": "Place", "name": "Toronto, Canada" },
      "image": "{{ "profile4.jpeg" | absURL }}",
      "url": "{{ "about/" | absURL }}",
      "sameAs": ["https://www.imdb.com/name/nm13775288/"],
      "mainEntityOfPage": { "@id": "{{ "/" | absURL }}#website" }
    },
    {
      "@type": "WebSite",
      "@id": "{{ "/" | absURL }}#website",
      "url": "{{ "/" | absURL }}",
      "name": "Louis Andrada (Han’drada)",
      "description": "{{ $desc }}",
      "inLanguage": "en",
      "author": { "@id": "{{ "/" | absURL }}#person" },
      "publisher": { "@id": "{{ "/" | absURL }}#person" },
      "about": { "@id": "{{ "/" | absURL }}#person" }
    }
  ]
}
</script>
