baseURL = "https://handrada.com/"
languageCode = "en-us"
title = "Louis Andrada"
theme = "portfolio-theme"
enableRobotsTXT = false
# No tags/categories are used on this site; don't generate empty pages for them.
disableKinds = ["taxonomy", "term"]

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[frontmatter]
  lastmod = ["lastmod", ":fileModTime", ":default"]

[permalinks]
  artworks = "/artworks/:contentbasename/"
  archive  = "/archive/:contentbasename/"

[outputs]
  home = ["HTML", "RSS"]

[params]
  books_image_base = "https://raw.githubusercontent.com/louis7andrada/louis-andrada-images/main/books"
  recaptcha_site_key = "6LcOzL8sAAAAAAf811mO6GNulTWREGNzkzxTScVk"
