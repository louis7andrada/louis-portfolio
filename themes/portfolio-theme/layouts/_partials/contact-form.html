<div id="contactSuccessMessage" class="hidden mb-6 text-green-600 font-medium text-center">
  Thank you — your message has been sent successfully. Louis will get back to you soon.
</div>
<div id="contactErrorMessage" class="hidden mb-6 text-red-600 font-medium text-center">
  Something went wrong sending your message. Please check your information and try again.
</div>
<form 
  id="contactForm"
  class="grid grid-cols-1 gap-4"
>
  <!-- reCAPTCHA v3 token -->
  <input type="hidden" name="g-recaptcha-response" class="recaptcha-token-field">
  <input 
    type="text" 
    name="name" 
    placeholder="Full name*" 
    class="inq-field border bg-gray-100 border-gray-300 rounded p-3"
    required
  />
  <input 
    type="email" 
    name="email" 
    placeholder="Email*" 
    class="inq-field border bg-gray-100 border-gray-300 rounded p-3"
    required
  />
  <input 
    type="tel" 
    name="phone" 
    placeholder="Phone number*" 
    class="inq-field border bg-gray-100 border-gray-300 rounded p-3"
    required
  />
  <textarea 
    name="message" 
    placeholder="Your message...*"
    rows="5"
    class="inq-field border bg-gray-100 border-gray-300 rounded p-3"
    required
  ></textarea>
  <button 
    type="submit"
    class="px-6 py-3 bg-[#575757] text-white rounded-lg font-medium hover:bg-[#9a9a9a] transition"
  >
    Send Message
  </button>
</form>
<script>
  const form = document.getElementById("contactForm"),
    successMessage = document.getElementById("contactSuccessMessage"),
    errorMessage = document.getElementById("contactErrorMessage"),
    submitBtn = form.querySelector('button[type="submit"]');
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const s = document.querySelector('.inq-mobile-submit[data-target="contactForm"]'),
      t = [submitBtn, s].filter(Boolean),
      r = t.map(function (e) {
        return e.textContent;
      });
    function h() {
      t.forEach(function (e) {
        ((e.disabled = !0), (e.style.opacity = "0.5"), (e.textContent = "Sending…"));
      });
    }
    function i() {
      t.forEach(function (e, t) {
        ((e.disabled = !1), (e.style.opacity = ""), (e.textContent = r[t]));
      });
    }
    (successMessage.classList.add("hidden"), errorMessage.classList.add("hidden"), h());
    let c = !1;
    const m = setTimeout(() => {
        if (c) return;
        i();
      }, 15e3),
      l = () => {
        ((c = !0), clearTimeout(m));
      };
    var n = window.__inqSubmitConvergence,
      d = form.closest(".inq-panel"),
      u =
        s && s.offsetParent !== null
          ? s
          : submitBtn && submitBtn.offsetParent !== null
            ? submitBtn
            : s || submitBtn,
      o =
        n && d && u
          ? n.run(d, u)
          : {
              finished: Promise.resolve(),
              restore: function () {},
              reverseAndRestore: function () {
                return Promise.resolve();
              },
            };
    async function a(e) {
      (await o.reverseAndRestore(),
        l(),
        i(),
        (errorMessage.textContent = e),
        errorMessage.classList.remove("hidden"));
    }
    try {
      const e = await window.checkHuman();
      if (!e.human) {
        await a("Your submission was flagged by our security check. Please try again.");
        return;
      }
      e.token && (form.querySelector(".recaptcha-token-field").value = e.token);
      const c = {
          action: "contact",
          email: form.querySelector('[name="email"]').value.trim(),
          fullName: form.querySelector('[name="name"]').value.trim(),
          phone: form.querySelector('[name="phone"]').value.trim(),
          message: form.querySelector('[name="message"]').value.trim(),
        },
        d = window.laPost(window.APP_CONFIG.googleScriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(c),
        }).then(function (e) {
          return e.text().then(function (t) {
            return { ok: e.ok, text: t };
          });
        }),
        u = await Promise.all([d, o.finished]),
        s = u[0],
        h = String(s.text).trim();
      s.ok && h === "OK"
        ? (n
            ? n.showSuccess(t)
            : t.forEach(function (e) {
                e.textContent = "Sent";
              }),
          setTimeout(function () {
            (o.restore(),
              form.reset(),
              successMessage.classList.remove("hidden"),
              n && n.clearSuccess(t, r),
              l(),
              i());
          }, 1800))
        : await a("There was an error. Please try again later.");
    } catch {
      await a("There was an error. Please try again later.");
    }
  });
</script>
