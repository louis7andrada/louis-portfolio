baseURL = "https://andrada.one/"
languageCode = "en-us"
title = "ᛃᚨ Andrada"
theme = "portfolio-theme"
enableRobotsTXT = true
# No tags/categories are used on this site; don't generate empty pages for them.
disableKinds = ["taxonomy", "term"]

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[frontmatter]
  lastmod = ["lastmod", ":fileModTime", ":default"]

[permalinks]
  artworks = "/artworks/:contentbasename/"
  archive  = "/archive/:contentbasename/"
  oeuvre   = "/oeuvre/:contentbasename/"
  photography = "/photography/:contentbasename/"
  vestments = "/vestments/:contentbasename/"
  production = "/production/:contentbasename/"

# Ny's tracks (Production) are MP3s that Hugo fetches and publishes under /audio/
# (_partials/audio-url.html); Hugo has no audio type of its own to recognise them by.
[mediaTypes]
  [mediaTypes."audio/mpeg"]
    suffixes = ["mp3"]

[outputs]
  home = ["HTML", "RSS"]
  # Section feeds too (/artworks/index.xml, /oeuvre/index.xml, /archive/index.xml).
  # Feeds are a discovery channel of their own — aggregators and crawlers poll
  # them, and they surface new work without waiting on a full site crawl.
  section = ["HTML", "RSS"]

[params]
  # Dark mode only (Oct 2026). false = always dark, no toggle button for visitors.
  # true brings back the light/dark toggle exactly as it was (the code is all kept).
  light_mode = false

  recaptcha_site_key = "6LcOzL8sAAAAAAf811mO6GNulTWREGNzkzxTScVk"
  webhook_url = "https://script.google.com/macros/s/AKfycbxxnqf8ImE2r9tkV60_7cIQJC4TvdzyDrDc0MovRvk9m4cN_lEntF1LS1EFV5VHmd19/exec"

  # Identity, in one place — used by the <head> metadata and every JSON-LD
  # block, so the name and profiles never drift between pages.
  # legal_name: the legal entity, used ONLY in legal statements (copyright notices, license, privacy).
  # Everything public uses the names below. The Person node (JSON-LD) is "ᛃᚨ Andrada" with every
  # other name as an alternateName, so all of them resolve to one entity.
  legal_name = "Luis R. P. Andrada"
  # Declared to search engines/AI in JSON-LD (sameAs) only — intentionally not
  # rendered as visible links anywhere on the site.
  profile_imdb = "https://www.imdb.com/name/nm13775288/"
  # The one exception (Louis, 2026-10-14): Luis's page (Career, luis.andrada.one) shows LinkedIn as a
  # visible link, since that page is meant to be the same thing as his LinkedIn profile.
  profile_linkedin = "https://www.linkedin.com/in/louis7andrada/"

  # ANDRADA.ONE (Oct 2026): one domain, one person, six names. Each name owns a part of the work
  # and lives on its own subdomain, which opens on a home-page-style hero (one image + the staggered
  # menu, the grid below):
  #   louis.andrada.one → Artworks (the home page)   han.andrada.one → Oeuvre   odi.andrada.one → Photography
  #   l.andrada.one → Vestments (L', Oct 2026)        ny.andrada.one → Production (Ny, Oct 2026)
  #   luis.andrada.one → Career (Luis, Oct 2026: his work life, a resume / LinkedIn-style page)
  #   andrada.one       → the Links page (the hub: every name, every door)
  # The menus jump between them (Photography → odi.andrada.one…, Links → andrada.one); shared pages
  # (About, Inquiry, Archive…) stay on whichever subdomain the visitor is on. netlify.toml serves each
  # subdomain's front page and sends a section asked for on the wrong host (and every old
  # handrada.com / louisandrada.com address) to its one real address.
  #
  # NAMES (Louis, Oct 2026): every page carries ONE name, in its title, description, keywords, link
  # previews, author and JSON-LD credits: the owner of the page's section (louis. paintings, han. books,
  # odi. photographs, l. vestments, ny. music production, luis. career), or name_default = "ja" (ᛃᚨ Andrada, ᛃᚨ = the runes Jera + Ansuz used as a first
  # name) for andrada.one itself and the shared pages that live there. Never two names side by side.
  # In the browser a face subdomain always shows its own name; on andrada.one, ?name=<key> picks it
  # for the visit (removed from the address bar). Only the Person node lists every name (alternateName).
  # Off andrada.one (hugo server, any other baseURL) all of this falls back to plain local paths.
  name_default = "ja"
  face_domain = "andrada.one"
  hub = "/links/"

  [params.names]
    han = "Han’drada"
    louis = "Louis Andrada"
    odi = "Odi Andrada"
    l = "L'"
    ny = "Ny"
    luis = "Luis Andrada"   # career (Louis, 2026-10-14); NOT the legal name (legal_name), which stays in legal statements
    nilo = "Nilo"   # no section yet (Louis, 2026-10-13: "surprises soon"); in About, the intro door, alternateName
    ja = "ᛃᚨ Andrada"

  # Each name's own description (meta description where a page has none of its own, WebSite JSON-LD).
  [params.taglines]
    louis = "Paintings by Louis Andrada, a Brazilian-born painter based in Toronto: dark, existentialist figurative work."
    han = "Illustrated artist books by Han’drada: philosophical tellings on entropy, consciousness, mortality, memory and faith, readable in full online."
    odi = "Photographs by Odi Andrada, in two collections: Ambiguous (abstract, black and white) and Lucid."
    l = "Vestments by L'."
    ny = "Electronic music produced by Ny."
    luis = "Luis Andrada, Toronto: research coordinator, data analyst and programmer. Data validation, quality control, REDCap, automation and analysis."
    ja = "ᛃᚨ Andrada is a Brazilian-born artist based in Toronto who works under six names: Louis Andrada (paintings), Han’drada (illustrated books), Odi Andrada (photography), L' (vestments), Ny (music production) and Luis Andrada (career: research, data and programming)."

  # Each name's keywords (meta keywords), its own name first.
  [params.keywords]
    louis = "Louis Andrada, paintings, painter, original paintings, Toronto artist, Brazilian artist, contemporary art, fine art, dark art, figurative painting, existentialism"
    han = "Han’drada, Han'drada, Handrada, Han Andrada, artist books, illustrated books, philosophical fiction, existentialism, tellings, read online"
    odi = "Odi Andrada, photography, photographs, black and white photography, abstract photography, fine art photography"
    l = "L', vestments, garments, clothing, shirts"
    ny = "Ny, music producer, music production, electronic music, tracks, listen online"
    luis = "Luis Andrada, research coordinator, data analyst, quality assurance, computer programming, Python, SQL, REDCap, data validation, automation, Toronto"
    ja = "ᛃᚨ Andrada, Andrada, Louis Andrada, Han’drada, Odi Andrada, L', Ny, Luis Andrada, artist, painter, writer, photographer, music producer, Toronto artist, Brazilian artist"

  # page: the page that IS the face's front page (served at https://<key>.andrada.one/).
  # section: the content section the face owns (its pages live on the face's subdomain).
  # hero: the image at the top. Odi: a photo id ("photo107"); empty = the newest Ambiguous photo.
  #       Han: a book id; empty = the newest book (highest order). L': a vestment id; empty = the newest.
  #       Ny: a track id ("omnipulse"); empty = the newest. Louis: set in index.html.
  #       Luis: no items, the portrait in career/list.html.
  [params.faces.louis]
    page = "/"
    section = "artworks"
  [params.faces.han]
    page = "/oeuvre/"
    section = "oeuvre"
    hero = ""
  [params.faces.odi]
    page = "/photography/"
    section = "photography"
    hero = "photo106"   # cvi (Ambiguous), chosen by Louis 2026-10-02
  [params.faces.l]
    page = "/vestments/"
    section = "vestments"
    hero = ""
  [params.faces.ny]
    page = "/production/"
    section = "production"
    hero = "ritual-annihilation-a"   # the latest release, chosen by Louis 2026-10-12
  [params.faces.luis]
    page = "/career/"
    section = "career"
